name: R5 Model Adapters and PR Feedback Tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  r5-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: python -m pip install 'jsonschema>=4.18,<5' 'Pillow>=10,<13'
      - name: Test provider payloads, QA contracts and PR SHA security
        run: python -m unittest discover -s tests -p 'test_r5_automation.py' -v
