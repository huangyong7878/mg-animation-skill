name: MG Full Regression Suite
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'Pillow>=10,<13' 'jsonschema>=4.18,<5' 'numpy>=1.24,<3'
      - name: Install offline audio tools for TTS regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg
      - name: Run all repository unit tests
        run: python -m unittest discover -s tests -v
