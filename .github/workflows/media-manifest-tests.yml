name: Render Media Manifest Policy
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  media-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Verify media manifest logic
        run: python -m unittest discover -s tests -p 'test_media_manifest.py' -v
