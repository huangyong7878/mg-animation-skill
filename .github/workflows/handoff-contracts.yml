name: Multi-model Handoff Contract
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  handoff-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Verify draft JSON examples
        run: |
          python workflow/check_handoff.py --spec examples/workflow_orders_spec.json --delivery examples/workflow_orders_delivery.json --qa examples/workflow_orders_qa.json
      - name: Run handoff tests
        run: python -m unittest discover -s tests -p 'test_handoff.py' -v
