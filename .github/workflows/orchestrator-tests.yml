name: MG Orchestrator Tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Handoff and orchestrator regressions
        run: |
          python -m unittest discover -s tests -p 'test_handoff.py' -v
          python -m unittest discover -s tests -p 'test_orchestrator.py' -v
      - name: Prepare isolated example without external calls
        run: |
          python workflow/orchestrator.py prepare --spec examples/workflow_orders_spec.json --workdir /tmp/mg-orchestrator-test --executor muse
          python workflow/orchestrator.py publish --workdir /tmp/mg-orchestrator-test --repo example/mg --dry-run
          python workflow/orchestrator.py status --workdir /tmp/mg-orchestrator-test
