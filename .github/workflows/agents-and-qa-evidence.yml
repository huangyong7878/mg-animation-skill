name: Agent Router and Video QA Evidence
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  role-router-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'jsonschema>=4.18,<5' 'Pillow>=10,<13'
      - name: Verify role routing and QA evidence packaging
        run: python -m unittest discover -s tests -p 'test_qa_evidence.py' -v
      - name: Install FFmpeg for video smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Smoke test real ffmpeg extraction and SHA256 verification
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=960x540:r=24:d=13 -c:v mpeg4 -qscale:v 5 -y /tmp/mg_evidence_smoke.mp4
          python workflow/qa_evidence.py create --spec examples/workflow_orders_spec.json \
            --video /tmp/mg_evidence_smoke.mp4 --outdir /tmp/mg_evidence_smoke \
            --interval 5 --focus 5.3 --focus-radius 0.4 --focus-step 0.2
          python workflow/qa_evidence.py verify --spec examples/workflow_orders_spec.json \
            --video /tmp/mg_evidence_smoke.mp4 --evidence-dir /tmp/mg_evidence_smoke
