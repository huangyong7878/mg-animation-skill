name: Visual Contract Gate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate contract gate
        run: python -m unittest discover -s tests -p 'test_*contract*.py' -v
