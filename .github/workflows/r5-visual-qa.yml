name: R5 Independent Visual QA

# Billing safety: NEVER trigger paid model calls automatically on PR pushes.
# An operator explicitly selects ONE successful, immutable Pilot PR render run.
on:
  workflow_dispatch:
    inputs:
      render_run_id:
        description: "Successful Pilot 001 PR render run ID to review exactly once"
        required: true
        type: string

# The dispatcher always executes code on trusted main, not PR code.
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

# Concurrent requests for the same source run are serialized. A successful
# first review will publish an SHA/run marker, so later repeats skip API billing.
concurrency:
  group: r5-manual-${{ inputs.render_run_id }}
  cancel-in-progress: false

jobs:
  visual-review:
    # R5_ENABLED=true is a necessary gate but NEVER sufficient to trigger work.
    # Operator must also click Run workflow and supply a run ID.
    if: >-
      ${{ vars.R5_ENABLED == 'true' &&
          (vars.R5_PROVIDER == 'gemini' || vars.R5_PROVIDER == 'openai' || vars.R5_PROVIDER == 'deepseek') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main ONLY
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted review dependencies
        run: python -m pip install 'jsonschema>=4.18,<5' 'Pillow>=10,<13'
      - name: Resolve selected run through authenticated GitHub API
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SELECTED_RUN: ${{ inputs.render_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python workflow/r5_dispatch_event.py \
            --render-run-id "$SELECTED_RUN" \
            --out "$RUNNER_TEMP/r5_source_event.json"
      - name: Preflight PR SHA and completed review before billing
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow/r5_pr_feedback.py --event "$RUNNER_TEMP/r5_source_event.json" --preflight
      - name: Download signed-to-run video, spec and evidence
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.source_run }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r5_input
      - name: Call configured visual model once and validate QA
        if: steps.gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          R5_ENABLED: ${{ vars.R5_ENABLED }}
          R5_PROVIDER: ${{ vars.R5_PROVIDER }}
          R5_MODEL: ${{ vars.R5_MODEL }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_RUN: ${{ steps.source.outputs.source_run }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$R5_MODEL" ]]; then
            echo "::error::Configure repository Actions variable R5_MODEL."
            exit 1
          fi
          python workflow/r5_review.py \
            --artifact-root "$RUNNER_TEMP/r5_input" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$SOURCE_RUN" \
            --artifact-name "$ARTIFACT_NAME" \
            --provider "$R5_PROVIDER" --model "$R5_MODEL" \
            --out "$RUNNER_TEMP/r5_output"
          python workflow/check_handoff.py \
            --spec "$RUNNER_TEMP/r5_input/director_spec.json" \
            --delivery "$RUNNER_TEMP/r5_input/delivery.json" \
            --qa "$RUNNER_TEMP/r5_output/qa_report.json"
      - name: Archive QA report and token usage (30 days)
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r5-review-${{ steps.source.outputs.source_run }}-${{ steps.source.outputs.source_sha }}
          path: ${{ runner.temp }}/r5_output/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish validated QA feedback to matching open PR
        if: steps.gate.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python workflow/r5_pr_feedback.py \
            --event "$RUNNER_TEMP/r5_source_event.json" \
            --report "$RUNNER_TEMP/r5_output/qa_report.json" \
            --audit "$RUNNER_TEMP/r5_output/r5_audit.json"
