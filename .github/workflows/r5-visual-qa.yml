name: R5 Independent Visual QA

on:
  workflow_run:
    workflows: ["Pilot 001 Render and QA Artifact"]
    types: [completed]

# Privileged workflow_run is safe only with trusted main code and DATA-only artifacts.
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: r5-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  visual-review:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (vars.R5_PROVIDER == 'gemini' || vars.R5_PROVIDER == 'openai') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Never checkout github.event.workflow_run.head_sha, PR head or uploaded code.
      - name: Checkout trusted main ONLY
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted review dependencies
        run: python -m pip install 'jsonschema>=4.18,<5' 'Pillow>=10,<13'
      - name: Bind immutable source SHA and artifact name
        id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "artifact_name=mg-orders_two_routes-r1-ci-${SOURCE_RUN}-${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Download video, spec and manifest from exact render run
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r5_input
      - name: Call configured visual model once, validate QA report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R5_PROVIDER: ${{ vars.R5_PROVIDER }}
          R5_MODEL: ${{ vars.R5_MODEL }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$R5_MODEL" ]]; then
            echo "::error::Configure repository Actions variable R5_MODEL explicitly."
            exit 1
          fi
          python workflow/r5_review.py \
            --artifact-root "$RUNNER_TEMP/r5_input" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$SOURCE_RUN" \
            --artifact-name "$ARTIFACT_NAME" \
            --provider "$R5_PROVIDER" --model "$R5_MODEL" \
            --out "$RUNNER_TEMP/r5_output"
          python workflow/check_handoff.py \
            --spec "$RUNNER_TEMP/r5_input/director_spec.json" \
            --delivery "$RUNNER_TEMP/r5_input/delivery.json" \
            --qa "$RUNNER_TEMP/r5_output/qa_report.json"
      - name: Store model QA and usage (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-review-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/r5_output/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish validated QA feedback to correct, still-open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python workflow/r5_pr_feedback.py \
            --event "$GITHUB_EVENT_PATH" \
            --report "$RUNNER_TEMP/r5_output/qa_report.json" \
            --audit "$RUNNER_TEMP/r5_output/r5_audit.json"
