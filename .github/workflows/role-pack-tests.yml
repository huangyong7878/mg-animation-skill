name: Portable Director Role Pack
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  role-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Run portable role pack tests
        run: python -m unittest discover -s tests -p 'test_role_pack.py' -v
      - name: Director ZIP smoke test (no model invocation)
        run: |
          printf 'Explain why two orders go different ways.' > /tmp/mg-brief.md
          python workflow/role_pack.py director --brief /tmp/mg-brief.md --out /tmp/mg-portable-director
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('/tmp/mg-portable-director.zip') as z:
              assert {'role.md', 'START_HERE.md', 'contract.schema.json', 'manifest.json'} <= set(z.namelist())
          PY
