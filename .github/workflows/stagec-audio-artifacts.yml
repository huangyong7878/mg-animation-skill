name: Stage C Pilot Narration and AV Draft

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'work/orders_pilot/stagec_narration.json'
      - 'work/orders_pilot/scene.json'
      - 'examples/workflow_orders_spec.json'
      - 'workflow/build_stagec_artifact.py'
      - 'scripts/narrate.py'
      - 'scripts/render.py'
      - '.github/workflows/stagec-audio-artifacts.yml'

# No model keys; PR code is untrusted. Stage C is a test, never a release.
permissions:
  contents: read

concurrency:
  group: stagec-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stagec-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit (no write credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline TTS, rendering and font dependencies
        run: |
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.24,<3' 'jsonschema>=4.18,<5'
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg fonts-noto-cjk
      - name: Build Stage C *draft* audio and actual AV preview
        id: build
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          ARTIFACT_NAME="mg-orders-stagec-draft-${GITHUB_RUN_ID}-${SOURCE_SHA:0:12}"
          ARTIFACT_DIR="${RUNNER_TEMP}/stagec-draft"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python workflow/build_stagec_artifact.py \
            --spec examples/workflow_orders_spec.json \
            --scene work/orders_pilot/scene.json \
            --plan work/orders_pilot/stagec_narration.json \
            --source-sha "$SOURCE_SHA" \
            --artifact-root "$ARTIFACT_DIR" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-url "$RUN_URL"
          python workflow/media_manifest.py verify \
            --manifest "$ARTIFACT_DIR/media_manifest.json" \
            --artifact-root "$ARTIFACT_DIR" \
            --spec "$ARTIFACT_DIR/director_spec.json" \
            --delivery "$ARTIFACT_DIR/delivery.json"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload Stage C prototype audio/timing/video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/stagec-draft/
          if-no-files-found: error
          retention-days: 30
      - name: Publish draft-only run summary
        if: success()
        run: |
          echo "### Stage C: offline TTS / measured timings / AV draft" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \$${{ steps.build.outputs.source_sha }}\$" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \$${{ steps.build.outputs.artifact_name }}\$" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Files:** media/voice.wav, media/timings.json, media/timings.srt, media/stagec_av_preview.mp4" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Not released:** spec, script and audio approval remain draft. R5 Gemini has not reviewed this AV preview." >> "$GITHUB_STEP_SUMMARY"
